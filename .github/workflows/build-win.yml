name: build-windows

# UMA Windows 移植 CI（Phase 1 · UMA 插件层注入）
# 官方 package-target.ts 全流程 + patches/uma-phase1.patch（6 处上游源码改动）
# 注入链路：patch 提供注入 hook（DSH_DESKTOP_UMA_INJECT）→ prepare:dsh 后运行
# scripts/inject-uma.mjs：12 个 uma 插件包 + ssh2 闭包 + 重算 desktop-runtime.json
# 产品激活：uma-platform.patch.yml（win32 版）随包附带；Host 经 DSH_DESKTOP_PRODUCT_PATCH 应用
# TODO(Phase 2)：品牌（productName/icon/uma://）、locale、菜单、updater discard、DSH_HOME=~/.uma
# TODO(Phase 3)：签名接入（secrets → DSH_DESKTOP_WINDOWS_*，用 package:desktop:win:x64 签名版）

on:
  push:
    branches: [main]
  workflow_dispatch:

# 一次 Windows 全量打包约 60-120 分钟：新提交到达时取消仍在跑的旧任务，避免叠加占用 runner。
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # 官方源码基线：与 Mac 包 1.0.0-beta3.20261116.1 内核同版本
  DSH_REF: 39163dd30f703a79079e2d2446545cff3c453738
  DSH_REPO: https://github.com/deepseek-ai/deepseek-harness

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout (port workspace)
        uses: actions/checkout@v7.0.1

      - name: Checkout upstream dsh @ pinned ref
        uses: actions/checkout@v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_REF }}
          path: deepseek-harness
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.9.0

      - name: Setup pnpm 11.28.5
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.28.5

      - name: Write desktop release environment (.env.windows)
        # 官方 .env.windows.example 要求的最小未签名集合 + UMA 产品身份（Phase 2 起生效）：
        # - APP_ID：reverse-DNS，与 Mac 版 bundle id 对齐（studio.uma.desktop）
        # - PRODUCT_NAME / PROTOCOL_SCHEME / ARTIFACT_BASE：品牌与 uma:// 协议
        # - MANAGED_ACCOUNT=1：开启 .uma 数据根 + uma:// 注册（等价 UMA 壳的 managedAccount）
        # - MANDATORY_UPDATE_*：win32 即使 unsigned 也必须提供策略 origin（打包时嵌入）
        working-directory: deepseek-harness/apps/desktop
        shell: pwsh
        run: |
          $lines = @(
            'DSH_DESKTOP_APP_ID=studio.uma.desktop'
            'DSH_DESKTOP_PRODUCT_NAME=UMA Studio'
            'DSH_DESKTOP_PROTOCOL_SCHEME=uma'
            'DSH_DESKTOP_ARTIFACT_BASE=uma-studio'
            'DSH_DESKTOP_MANAGED_ACCOUNT=1'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=test'
            'DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://studio.umayun.com'
            'DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://studio.umayun.com"]}'
          )
          Set-Content -Path .env.windows -Value $lines -Encoding utf8
          Get-Content .env.windows

      - name: Apply UMA patches to upstream source
        # 从 git blob 取补丁，绕过 Windows runner 的 core.autocrlf 工作树换行转换：
        # 补丁一旦变成 CRLF，git apply 的上下文行尾部多出 \r，全部 hunk 匹配失败。
        # 顺序敏感：phase1（注入链路）→ phase2（产品身份/协议/数据根）→ phase2b（8 语 locale 字典）。
        working-directory: deepseek-harness
        shell: bash
        run: |
          set -euo pipefail
          for name in uma-phase1.patch uma-phase2.patch uma-phase2b.patch uma-phase2c.patch; do
            patch_file="$RUNNER_TEMP/$name"
            git -C .. cat-file blob "HEAD:patches/$name" > "$patch_file"
            if grep -q $'\r' "$patch_file"; then
              echo "::error::$name contains CRLF; patch would fail to apply"
              exit 1
            fi
            echo "--- applying $name"
            git apply --check --whitespace=nowarn --verbose "$patch_file"
            git apply --whitespace=nowarn --verbose "$patch_file"
          done
          git --no-pager diff --stat

      - name: Overlay UMA renderer assets
        # UMA 品牌的欢迎页/更新对话框 renderer 文件直接覆盖上游同名文件
        # （mandatory-update-frame.js 已在资产准备期把 uma-app:// 改回 dsh-app://）。
        shell: bash
        run: node scripts/overlay-renderer.mjs
        env:
          UMA_PORT_ROOT: ${{ github.workspace }}

      - name: Install dependencies
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Package Windows installer (unsigned, official pipeline + UMA injection)
        working-directory: deepseek-harness
        run: pnpm run package:desktop:win:x64:unsigned
        env:
          # prepare:dsh 之后、electron-builder 之前执行 UMA 注入（patch 提供的 hook）
          DSH_DESKTOP_UMA_INJECT: ${{ github.workspace }}/scripts/inject-uma.mjs
          UMA_PORT_ROOT: ${{ github.workspace }}
          UMA_ASSETS_DIR: ${{ github.workspace }}/uma-assets
          # UMA 品牌资产（icon.ico / tray.ico / icon.png），由 electron-builder 配置读取
          DSH_DESKTOP_BRAND_DIR: ${{ github.workspace }}/uma-assets/brand

      - name: Collect artifacts
        shell: pwsh
        run: |
          $src = 'deepseek-harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          if (-not (Test-Path $src)) { throw "artifact dir missing: $src" }
          Get-ChildItem $src

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: uma-window-baseline
          path: deepseek-harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packaging-logs
          path: deepseek-harness/apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
