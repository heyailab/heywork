name: build-windows

# UMA Windows 移植 CI（Phase 1 · UMA 插件层注入）
# 官方 package-target.ts 全流程 + patches/uma-phase1.patch（6 处上游源码改动）
# 注入链路：patch 提供注入 hook（DSH_DESKTOP_UMA_INJECT）→ prepare:dsh 后运行
# scripts/inject-uma.mjs：12 个 uma 插件包 + ssh2 闭包 + 重算 desktop-runtime.json
# 产品激活：uma-platform.patch.yml（win32 版）随包附带；Host 经 DSH_DESKTOP_PRODUCT_PATCH 应用
# TODO(Phase 2)：品牌（productName/icon/uma://）、locale、菜单、updater discard、DSH_HOME=~/.uma
# TODO(Phase 3)：签名接入（secrets → DSH_DESKTOP_WINDOWS_*，用 package:desktop:win:x64 签名版）

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # 官方源码基线：与 Mac 包 1.0.0-beta3.20261116.1 内核同版本
  DSH_REF: 39163dd30f703a79079e2d2446545cff3c453738
  DSH_REPO: https://github.com/deepseek-ai/deepseek-harness

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout (port workspace)
        uses: actions/checkout@v7.0.1

      - name: Checkout upstream dsh @ pinned ref
        uses: actions/checkout@v7.0.1
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_REF }}
          path: deepseek-harness
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.9.0

      - name: Setup pnpm 11.28.5
        uses: pnpm/action-setup@v5.0.0
        with:
          version: 11.28.5

      - name: Write desktop release environment (.env.windows)
        # 官方 .env.windows.example 要求的最小未签名集合：
        # - APP_ID：reverse-DNS，先与 Mac 版 bundle id 对齐（studio.uma.desktop）
        # - MANDATORY_UPDATE_*：win32 即使 unsigned 也必须提供策略 origin（打包时嵌入）
        working-directory: deepseek-harness/apps/desktop
        shell: pwsh
        run: |
          $lines = @(
            'DSH_DESKTOP_APP_ID=studio.uma.desktop'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=test'
            'DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://studio.umayun.com'
            'DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://studio.umayun.com"]}'
          )
          Set-Content -Path .env.windows -Value $lines -Encoding utf8
          Get-Content .env.windows

      - name: Apply UMA patches to upstream source
        working-directory: deepseek-harness
        run: git apply --whitespace=nowarn --verbose ../patches/uma-phase1.patch

      - name: Install dependencies
        working-directory: deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Package Windows installer (unsigned, official pipeline + UMA injection)
        working-directory: deepseek-harness
        run: pnpm run package:desktop:win:x64:unsigned
        env:
          # prepare:dsh 之后、electron-builder 之前执行 UMA 注入（patch 提供的 hook）
          DSH_DESKTOP_UMA_INJECT: ${{ github.workspace }}/scripts/inject-uma.mjs
          UMA_PORT_ROOT: ${{ github.workspace }}
          UMA_ASSETS_DIR: ${{ github.workspace }}/uma-assets

      - name: Collect artifacts
        shell: pwsh
        run: |
          $src = 'deepseek-harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          if (-not (Test-Path $src)) { throw "artifact dir missing: $src" }
          Get-ChildItem $src

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: uma-window-baseline
          path: deepseek-harness/apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packaging-logs
          path: deepseek-harness/apps/desktop/.desktop-build/packaging-runs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
